<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Night sea behind the island -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23264A"/>
      <stop offset="0.55" stop-color="#121531"/>
      <stop offset="1" stop-color="#070918"/>
    </linearGradient>
    <radialGradient id="glowSky" cx="0.5" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#2DE3B0" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#1FA2FF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#1FA2FF" stop-opacity="0"/>
    </radialGradient>
    <!-- Green to cyan, the app's accent -->
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1ED760"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1ED760"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#1ED760"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5F8F"/>
      <stop offset="1" stop-color="#FFB347"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1ED760" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FA2FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1FA2FF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <!-- macOS tile: 824 of 1024, with room for its shadow -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glowSky)"/>

    <!-- Waves around the island -->
    <path d="M100 700 C 230 650, 330 740, 470 700 S 720 650, 924 705 L 924 924 L 100 924 Z" fill="url(#wave2)"/>
    <path d="M100 770 C 250 720, 360 810, 520 770 S 760 720, 924 775 L 924 924 L 100 924 Z" fill="url(#wave1)"/>
    <path d="M100 845 C 260 805, 380 880, 540 845 S 780 800, 924 850 L 924 924 L 100 924 Z" fill="#22D3EE" fill-opacity="0.22"/>

    <!-- Top sheen -->
    <rect x="100" y="100" width="824" height="330" fill="url(#sheen)"/>
  </g>

  <!-- The island -->
  <rect x="216" y="312" width="592" height="202" rx="101" fill="#000"/>

  <!-- Live activity: a cover on the left… -->
  <rect x="282" y="359" width="108" height="108" rx="26" fill="url(#cover)"/>
  <circle cx="336" cy="413" r="26" fill="#000" fill-opacity="0.18"/>
  <circle cx="336" cy="413" r="8" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- …and the equalizer on the right -->
  <g fill="url(#accent)">
    <rect x="566" y="392" width="26" height="42" rx="13"/>
    <rect x="606" y="360" width="26" height="106" rx="13"/>
    <rect x="646" y="378" width="26" height="70" rx="13"/>
    <rect x="686" y="350" width="26" height="126" rx="13"/>
    <rect x="726" y="386" width="26" height="54" rx="13"/>
  </g>

  <!-- Reflection of the island in the water -->
  <rect x="330" y="600" width="364" height="18" rx="9" fill="url(#ring)" opacity="0.35"/>
  <rect x="400" y="640" width="224" height="12" rx="6" fill="url(#ring)" opacity="0.22"/>
</svg>
